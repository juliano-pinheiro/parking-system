<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Estaciona Parking</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body.login-body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      padding: 40px 36px;
      margin: 20px;
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .login-brand .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-brand strong {
      font-size: 20px;
      color: #0f172a;
    }
    .login-subtitle {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .login-field {
      margin-bottom: 18px;
    }
    .login-field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .login-field input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      color: #0f172a;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .login-field input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      margin-top: 6px;
    }
    .login-btn:hover { background: #1d4ed8; }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-error {
      display: none;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .login-error.show { display: block; }
    .login-footer {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      margin-top: 22px;
    }
  </style>
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="3" y="11" width="18" height="6" rx="2" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="7.5" cy="17" r="1.4" fill="currentColor"/>
          <circle cx="16.5" cy="17" r="1.4" fill="currentColor"/>
        </svg>
      </span>
      <strong>Estaciona Parking</strong>
    </div>
    <div class="login-subtitle">Acesse o sistema com suas credenciais</div>

    <div class="login-error" id="login-erro"></div>

    <form id="login-form">
      <div class="login-field">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" name="email" placeholder="seu@email.com" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" name="senha" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn" id="login-btn">Entrar</button>
    </form>

    <div class="login-footer">© 2026 Estaciona Parking</div>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const erroEl = document.getElementById("login-erro");
      const btn = document.getElementById("login-btn");
      erroEl.classList.remove("show");
      btn.disabled = true;
      btn.textContent = "Entrando...";

      const email = document.getElementById("login-email").value.trim();
      const senha = document.getElementById("login-senha").value;

      try {
        const resposta = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, senha }),
        });
        const dados = await resposta.json();
        if (!resposta.ok) {
          erroEl.textContent = dados.erro || "Falha no login.";
          erroEl.classList.add("show");
          btn.disabled = false;
          btn.textContent = "Entrar";
          return;
        }
        window.location.href = "/";
      } catch (erro) {
        erroEl.textContent = "Erro de conexão. Tente novamente.";
        erroEl.classList.add("show");
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
